{{ define "partials/modal.html" }}

  <div id="modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <!-- The modal title is an h2 so it follows each page's h2 title in heading order (accessibility). Class h5 keeps the size of Bootstrap's default h5 modal title. -->
          <h2 id="modalTitle" class="modal-title h5"></h2>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div id="modalContent" class="modal-body">
            {{ .modalContent }}
        </div>
        <!--
          Live regions for announce() in application.js while the modal is
          open (accessibility). Some screen readers ignore live regions
          outside an open modal. These sit outside #modalContent so they
          are not replaced when new content loads into the modal.
        -->
        <div id="modalSrStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="modalSrAlert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>
      </div>
    </div>
  </div>

{{ end }}
